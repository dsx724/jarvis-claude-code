[licensing]
# Set to true for commercial use. Validates that all models and voices used
# have commercially-compatible licenses (no CC BY-NC-SA 4.0 or research-only).
# When enabled, startup will error if non-commercial components are detected.
# You must either:
#   - Use kokoro TTS engine (Apache-2.0) or a [commercial] Piper voice
#   - Provide a custom wake word model via [wake_word] model_path
#     (bundled openwakeword models are CC BY-NC-SA 4.0)
commercial_use = false

[debug]
# Enable verbose timestamped debug logging per component.
# Set individual flags to true to profile specific stages.
models = false
recording = false
transcription = false
claude = false
tts = false
echo = false

[audio]
# Audio sample rate in Hz
rate = 16000
# Number of audio channels (1 = mono)
channels = 1
# Wake word detection chunk size in samples (80ms at 16kHz)
# openwakeword expects 1280 samples per chunk
chunk = 1280

[vad]
# Voice Activity Detection (Silero VAD) settings

# Speech probability threshold (0.0 - 1.0)
# Higher = less sensitive, lower = more sensitive
threshold = 0.7
# Silero VAD chunk size in samples (32ms at 16kHz)
# Silero requires exactly 512 samples per chunk
chunk = 512
# Seconds of silence after speech to stop recording
silence_duration = 1.0
# Seconds to wait for speech after wake word before giving up
pre_speech_timeout = 2.0
# Fraction of the silence window that must be quiet (0.0 - 1.0)
silence_ratio = 0.8
# Maximum recording duration in seconds (safety cap)
max_record_seconds = 15

[wake_word]
# Wake word name — used for display, TTS filtering, and built-in commands.
# Must match an openwakeword model file: hey_<name>_v0.1.onnx
# Available: jarvis, marvin, mycroft
name = jarvis

# Wake word detection threshold (0.0 - 1.0)
# Higher = fewer false activations, lower = more sensitive
threshold = 0.95

# Custom wake word model path (optional).
# If set, loads this ONNX file instead of the bundled openwakeword model.
# Use this for commercially-safe custom-trained models.
# model_path = /path/to/custom_wake_word.onnx

[stt]
# Speech-to-text model for Whisper
# Available models (smaller = faster, larger = more accurate):
#   tiny.en, base.en, small.en, medium.en, large-v3
# English-only models (.en suffix) are faster for English speech.
model = medium.en

# STT backend: faster-whisper, openvino, or auto
#   faster-whisper: CPU-only via CTranslate2 (no extra dependencies)
#   openvino:       CPU or Intel GPU via OpenVINO (requires optimum-intel[openvino] transformers)
#   auto:           Benchmarks all available backends on first run and picks the fastest.
#                   Result is cached in .cache/stt_auto.json; re-benchmarks if GPUs change.
#
# Performance (medium.en, 5s audio, your mileage may vary):
#   faster-whisper CPU:  ~2900 ms
#   openvino GPU (Arc):  ~880 ms   (3.3x faster)
#
# On first run with openvino or auto, the model is exported to OpenVINO IR
# format (~45s) and cached in .cache/ for fast subsequent loads (~2-8s).
backend = auto

# OpenVINO device for STT inference (only used when backend = openvino)
# Options: cpu, gpu, gpu.0, gpu.1, ..., or auto
# gpu picks the best available GPU (typically the discrete one).
# auto benchmarks all devices (CPU + GPUs) on first startup and caches the
# result. Re-benchmarks automatically if GPUs change.
# Use gpu.N to pin to a specific GPU. Run benchmark_stt.py to compare manually.
openvino_device = auto

[claude]
# Seconds before timing out Claude API calls
timeout = 600

[tts]
# Text-to-speech engine
# Available engines: piper, kokoro
engine = piper

# Voice model to use (engine-specific)
#
# Kokoro voices (see https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md):
#   af_heart     - American female (default, warm)
#   af_bella     - American female
#   af_nicole    - American female
#   af_sarah     - American female
#   af_sky       - American female
#   am_adam      - American male
#   am_michael   - American male
#   bf_emma      - British female
#   bf_isabella  - British female
#   bm_george    - British male
#   bm_lewis     - British male
# Kokoro requires kokoro-v1.0.onnx and voices-v1.0.bin in the voices/ directory.
#
# Piper voices (format: language-dataset-quality):
#   License key: [commercial] = OK for commercial use, [NC] = non-commercial only
#
#   en_US-lessac-medium    - US English, neutral professional [NC: research-only dataset]
#   en_US-lessac-high      - US English, neutral professional [NC: research-only dataset]
#   en_US-lessac-low       - US English, neutral professional [NC: research-only dataset]
#   en_US-amy-medium       - US English, female              [NC: CC BY-NC-SA 4.0]
#   en_US-amy-low          - US English, female              [NC: CC BY-NC-SA 4.0]
#   en_US-ryan-medium      - US English, male                [NC: CC BY-NC-SA 4.0]
#   en_US-ryan-high        - US English, male                [NC: CC BY-NC-SA 4.0]
#   en_US-ryan-low         - US English, male                [NC: CC BY-NC-SA 4.0]
#   en_US-arctic-medium    - US English, various speakers    [commercial: Apache-2.0]
#   en_US-hfc_male-medium  - US English, male                [commercial: Apache-2.0]
#   en_US-hfc_female-medium - US English, female             [commercial: Apache-2.0]
#   en_US-joe-medium       - US English, male                [commercial: Apache-2.0]
#   en_US-kusal-medium     - US English, male                [commercial: Apache-2.0]
#   en_US-kristin-medium   - US English, female              [commercial: Apache-2.0]
#   en_US-ljspeech-medium  - US English, female              [commercial: public domain]
#   en_US-libritts_r-medium - US English, multi-speaker      [commercial: CC BY 4.0]
#   en_GB-alan-medium      - British English, male           [commercial: Apache-2.0]
#   en_GB-alba-medium      - Scottish English, female        [commercial: CC BY 4.0]
#   en_GB-aru-medium       - British English, various        [commercial: Apache-2.0]
#   en_GB-cori-medium      - British English, female         [commercial: CC BY 4.0]
#   en_GB-jenny_dioco-medium - British English, female       [commercial: CC BY-SA 4.0]
#   en_GB-northern_english_male-medium - Northern English    [commercial: CC BY-SA 4.0]
#   en_GB-semaine-medium   - British English, various        [commercial: CC BY 4.0]
#   en_GB-southern_english_female-medium - Southern English   [commercial: CC BY-SA 4.0]
#   en_GB-vctk-medium      - British English, multi-speaker  [commercial: CC BY 4.0]
#
# Voices are downloaded automatically on first use from Hugging Face.
# Full list: https://github.com/rhasspy/piper/blob/master/VOICES.md
voice = en_US-ryan-high

# OpenVINO device for TTS inference: cpu, gpu, or gpu.N
# GPU can be faster for steady-state inference but has a ~20s cold start.
# gpu picks the best available GPU (typically the discrete one).
# Use gpu.N to pin to a specific GPU. Only effective when OpenVINO is available.
openvino_device = cpu

[telegram]
# Send voice replies alongside text responses
voice_replies = true

# Sensitive settings (bot_token, allowed_users) go in config/secrets.ini

[timing]
# Seconds before the first spoken filler while waiting for Claude
initial_ack_delay = 20.0
# Seconds between subsequent "still working" fillers
still_working_interval = 15

[messages]
# Comma-separated spoken messages (one is chosen randomly each time)
# You can add, remove, or change these to customize Jarvis's personality

# Initial fillers while waiting for Claude response
acknowledgements = Let me think about that., One moment., Working on it., Give me a second., On it., Let me look into that., Hmm let me see., Just a moment.

# Repeated fillers if Claude takes a long time
still_working = Still working on it., Almost there., Still thinking., Hang on still going., Bear with me., Still on it.

# Spoken on startup (one chosen randomly)
startup = Jarvis is ready., At your service., Online and listening., Ready when you are., All systems go., Standing by.

# Spoken on shutdown (one chosen randomly)
shutdown = Shutting down. Goodbye., Going offline. See you later., Powering down. Take care., Signing off., Going to sleep. Goodbye., Until next time.
