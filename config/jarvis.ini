[audio]
# Audio sample rate in Hz
rate = 16000
# Number of audio channels (1 = mono)
channels = 1
# Wake word detection chunk size in samples (80ms at 16kHz)
# openwakeword expects 1280 samples per chunk
chunk = 1280

[vad]
# Voice Activity Detection (Silero VAD) settings

# Speech probability threshold (0.0 - 1.0)
# Higher = less sensitive, lower = more sensitive
threshold = 0.7
# Silero VAD chunk size in samples (32ms at 16kHz)
# Silero requires exactly 512 samples per chunk
chunk = 512
# Seconds of silence after speech to stop recording
silence_duration = 1.0
# Seconds to wait for speech after wake word before giving up
pre_speech_timeout = 2.0
# Fraction of the silence window that must be quiet (0.0 - 1.0)
silence_ratio = 0.8
# Maximum recording duration in seconds (safety cap)
max_record_seconds = 15

[wake_word]
# Wake word name — used for display, TTS filtering, and built-in commands.
# Must match an openwakeword model file: hey_<name>_v0.1.onnx
# Available: jarvis, marvin, mycroft
name = jarvis

# Wake word detection threshold (0.0 - 1.0)
# Higher = fewer false activations, lower = more sensitive
threshold = 0.9

[stt]
# Speech-to-text model for faster-whisper
# Available models (smaller = faster, larger = more accurate):
#   tiny.en, base.en, small.en, medium.en, large-v3
# English-only models (.en suffix) are faster for English speech.
model = medium.en

[claude]
# Seconds before timing out Claude API calls
timeout = 600

[tts]
# Text-to-speech engine
# Available engines: piper
engine = piper

# Voice model to use (engine-specific)
#
# Piper voices (format: language-dataset-quality):
#   en_US-lessac-medium    - US English, neutral professional (default)
#   en_US-lessac-high      - US English, neutral professional (high quality)
#   en_US-lessac-low       - US English, neutral professional (low quality, faster)
#   en_US-amy-medium       - US English, female
#   en_US-amy-low          - US English, female (low quality, faster)
#   en_US-ryan-medium      - US English, male
#   en_US-ryan-high        - US English, male (high quality)
#   en_US-ryan-low         - US English, male (low quality, faster)
#   en_US-arctic-medium    - US English, various speakers
#   en_US-hfc_male-medium  - US English, male
#   en_US-hfc_female-medium - US English, female
#   en_US-joe-medium       - US English, male
#   en_US-kusal-medium     - US English, male
#   en_US-kristin-medium   - US English, female
#   en_US-ljspeech-medium  - US English, female
#   en_US-libritts_r-medium - US English, multi-speaker
#   en_GB-alan-medium      - British English, male
#   en_GB-alba-medium      - Scottish English, female
#   en_GB-aru-medium       - British English, various speakers
#   en_GB-cori-medium      - British English, female
#   en_GB-jenny_dioco-medium - British English, female
#   en_GB-northern_english_male-medium - Northern English, male
#   en_GB-semaine-medium   - British English, various speakers
#   en_GB-southern_english_female-medium - Southern English, female
#   en_GB-vctk-medium      - British English, multi-speaker
#
# Voices are downloaded automatically on first use from Hugging Face.
# Full list: https://github.com/rhasspy/piper/blob/master/VOICES.md
voice = en_US-lessac-medium

[timing]
# Seconds before the first spoken filler while waiting for Claude
initial_ack_delay = 20.0
# Seconds between subsequent "still working" fillers
still_working_interval = 15

[messages]
# Comma-separated spoken messages (one is chosen randomly each time)
# You can add, remove, or change these to customize Jarvis's personality

# Initial fillers while waiting for Claude response
acknowledgements = Let me think about that., One moment., Working on it., Give me a second., On it., Let me look into that., Hmm let me see., Just a moment.

# Repeated fillers if Claude takes a long time
still_working = Still working on it., Almost there., Still thinking., Hang on still going., Bear with me., Still on it.

# Spoken on startup (one chosen randomly)
startup = Jarvis is ready., At your service., Online and listening., Ready when you are., All systems go., Standing by.

# Spoken on shutdown (one chosen randomly)
shutdown = Shutting down. Goodbye., Going offline. See you later., Powering down. Take care., Signing off., Going to sleep. Goodbye., Until next time.
