name: "Built-in shutdown command"
time_scale: 1.0

interactions:
  - wake_word:
      silent_chunks: 3
      trigger_score: 0.95
    recording:
      speech_chunks: 10
    transcription: "Shut down."
    claude:
      delay: 0.1
      response: ""
    expected:
      claude_called: false
      exit_code: 0

termination: exit
